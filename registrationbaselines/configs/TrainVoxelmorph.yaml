# Voxelmorph training configuration, taking all default parameters from original repo

result_model_path: "registrationbaselines/tmp/test"
initial_weights_path : "registrationbaselines/tmp/test/_w.pt"
batch_size: 5
epochs: 3
steps_per_epoch: 3
load_model: null
initial_epoch: 0
lr: 0.0001
int_steps: 7
int_downsize: 2
enc:  [16, 32, 32, 32]
dec:  [32, 32, 32, 32, 32, 16, 16]
bidir: False
sim_loss: "mse"
reg_weight: 0.01
use_wandb: True
wandb_config_path: "registrationbaselines/configs/Wandb.yaml"
gpu:  '0'
cudnn_nondet: False
save_checkpoint : 20